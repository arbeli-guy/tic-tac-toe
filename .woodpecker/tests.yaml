---
when:
  event: push
  branch: feature/hadolint

steps:
############# HADOLINT #############
- name: hadolint
  image: hadolint/hadolint:latest
  entrypoint: ["hadolint", "--failure-threshold", "error", "--warning", "DL4000", "--warning", "DL3020", "Dockerfile"]

############## PRETTIER ##############
- name: prettier
  image: woodpeckerci/plugin-prettier:next
  settings:
    check: false
    path: .woodpecker/tests.yaml

############## PRETTIER-DIFF ##############
- name: show-prettier-diff
  image: alpine/git
  commands:
    - |
      echo "Prettier formatting summary:"
      git diff --stat
      echo ""
      git diff --color -U1 | sed 's/^diff --git/\n&/'
